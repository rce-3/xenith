---
- name: Install sshd
  ansible.builtin.include_tasks: sshd.yml
  when: tools.enable_sshd

- name: Partition the disk
  ansible.builtin.include_tasks: partition.yml
  when: tools.enable_partitioning

- name: Install QEMU/KVM
  ansible.builtin.include_tasks: qemu.yml
  when: tools.enable_qemu

- name: Install Rust
  ansible.builtin.include_tasks: rust.yml
  when: tools.enable_rust
