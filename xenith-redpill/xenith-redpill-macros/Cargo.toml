[package]
name = "xenith-redpill-macros"
description = "A derive macro for the xenith-redpill crate"

version = "0.1.0"
edition = "2024"

homepage = "<https://xenith.re>"
repository = "<https://github.com/theo-abel/xenith/>"

keywords = ["virtualization", "detection"]
license = "GPL-3.0-or-later"

authors = ["abel <67806187+theo-abel@users.noreply.github.com>"]

[lib]
proc-macro = true

[dependencies]
convert_case = "0.7.1"
darling = "0.20.10"
quote = "1.0.38"
syn = { version = "2.0.98", features = ["full"] }
