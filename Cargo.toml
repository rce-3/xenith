################################################################################
# Workspace settings
################################################################################

[workspace]
resolver = "3" # see https://doc.rust-lang.org/cargo/reference/resolver.html#resolver-versions
members = [
    "xenith-vm",
    "xenith-stealth",
    "xenith-redpill",
]
exclude = [ "xenith-website" ]

[workspace.package]
edition = "2024"
rust-version = "1.94.1"
license = "GPL-3.0-or-later"

version = "0.1.0"
publish = false

authors = ["abel <67806187+theo-abel@users.noreply.github.com>"]

homepage = "<https://xenith.re>"
documentation = "<https://xenith.re/docs/>"
repository = "<https://github.com/theo-abel/xenith/>"

keywords = ["virtualization", "detection", "vmi", "debugger", "hypervisor"]

[workspace.dependencies]
# Those dependencies are shared across all packages,
# so we define them here to avoid duplication.
log          = "0.4.25"
mac-addr     = { version = "0.3", features = ["serde"] }
tracing      = "0.1.44"
thiserror    = "2.0.18"
serde        = { version = "1.0.228", features = ["derive"] }
serde_json   = "1.0.149"
serde_yml    = "0.0.12"
tokio        = { version = "1.51.0", features = ["full"] }
memflow      = "0.2.4"
memflow-qemu = "0.2.1"
gdbstub      = "0.7.10"
gdbstub_arch = "0.3.3"
pyo3         = "0.28.3"

################################################################################
# Lint settings
################################################################################

[workspace.lints.clippy]
# Enable pedantic lint group
pedantic = "warn"
# restriction = "warn" # TODO: enable when ready to suffer

[workspace.lints.rust]
# Deny all warnings
warnings = "deny"

################################################################################
# Profile settings
################################################################################

[profile.bench]
inherits = "release"

[profile.release]
opt-level = 3  # use better optimizations
debug = true  # keep debug info in case of crash/bug
# enable link-time optimization, which can improve performance
# but also increase build time
lto = true
codegen-units = 1

[profile.mutants]
inherits = "test"
debug = "none"

[profile.optimized-release]
inherits = "release"
debug = false
strip = true
